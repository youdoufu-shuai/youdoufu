<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油豆腐🐷 - AI 创作</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --secondary-color: #bc13fe;
            --accent-color: #ff0055;
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Canvas Background */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #11111e 0%, #000000 100%);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            width: 95%;
            margin: 40px auto;
            padding: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
            z-index: 10;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 10px var(--primary-color);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .upload-area {
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            background: rgba(188, 19, 254, 0.1);
            box-shadow: 0 0 15px var(--secondary-color);
        }

        .upload-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .ratio-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ratio-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
            min-width: 60px;
        }

        .ratio-btn:hover, .ratio-btn.active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.3);
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--primary-color);
            color: var(--text-color);
            padding: 15px;
            border-radius: 10px;
            resize: vertical;
            min-height: 100px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 15px var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
        }

        button:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
        }

        button.secondary {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        button.secondary:hover {
            background: var(--secondary-color);
            color: #fff;
            box-shadow: 0 0 20px var(--secondary-color);
        }

        .templates {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .tag:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        #result-area {
            margin-top: 30px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        #result-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            display: none;
        }

        .download-btn {
            display: none;
            text-decoration: none;
            background: var(--accent-color);
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 0 15px var(--accent-color);
        }
        
        .loading {
            display: none;
            color: var(--primary-color);
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <canvas id="particles-js"></canvas>

    <div class="container">
        <div class="nav-bar">
            <a href="../index.html" class="nav-btn">🏠 返回主页</a>
            <a href="txt2img.html" class="nav-btn">📝 切换到文字生图</a>
        </div>

        <h1>油豆腐🐷的AI绘画 (图生图)</h1>

        <div class="upload-area" id="drop-zone">
            <p>点击或拖拽上传图片</p>
            <input type="file" id="image-upload" accept="image/*">
            <img id="preview" class="preview-image" alt="Preview">
        </div>

        <div class="templates">
            <span class="tag" onclick="setPrompt('以图片游戏人物为基础，生成一张三拼图格式的艺术感写真图，每张图固定比例为3:4，海边写真图，场景为海边沙滩，天空呈现夕阳晚霞，海面平静，画面中有人物和参考图一致，上部第一张为近景，站在沙滩上的背影，头发被风吹起，添加中英字幕“海的那边是什么” “ What is behind the sea?”。中部第2张是手持橙色花束，侧身站立于海边，添加中英字幕，“你不用告诉我” “ You dont have to tell me”。下部第三张是面部特写，头发随风飘动，添加中英字幕，“我自己会去看” “ I will go to see it mys')">3D渲染</span>
            <span class="tag" onclick="setPrompt('Using the nano-banana model, a commercial 1/7 scale figurine of the character in the picture was created, depicting a realistic style and a realistic environment. The figurine is placed on a computer desk with a round transparent acrylic base. There is no text on the base. The computer screen shows the Zbrush modeling process of the figurine. Next to the computer screen is a BANDAI-style toy box with the original painting printed on it. Picture ratio 16:9.')">手办化</span>
            <span class="tag" onclick="setPrompt('以图片游戏人物为基础，生成一张三拼图格式的艺术感写真图，每张图固定比例为3:4，雪景写真图，场景为圣诞风格的雪景，天空呈现夕阳晚霞，海面平静，画面中有人物和参考图一致，上部第一张为近景，站在雪景上的背影，头发被风吹起，添加中英字幕“雪花落下的速度是5米每秒” “ The speed of falling snowflakes is 5 meters per second.”。中部第2张是手持橙色花束，侧身站立于海边，添加中英字幕，“在雪花飘落之前” “Before the snow falls.”。下部第三张是面部特写，头发随风飘动，添加中英字幕，“我会奔向你” “ I will run to your side')">下雪</span>
            <span class="tag" onclick="setPrompt('3D渲染，Blender风格，极简主义')">3D渲染</span>
            <span class="tag" onclick="setPrompt('赛博朋克风格，霓虹灯光，高细节')">赛博朋克</span>
            <span class="tag" onclick="setPrompt('水彩画风格，柔和的色彩，艺术感')">水彩画</span>
            <span class="tag" onclick="setPrompt('吉卜力风格，动漫，清新自然')">吉卜力</span>
            <span class="tag" onclick="setPrompt('写实风格，8k分辨率，电影质感')">写实</span>
            <span class="tag" onclick="setPrompt('像素艺术，复古游戏风格')">像素风</span>
            <span class="tag" onclick="setPrompt('3D渲染，Blender风格，极简主义')">3D渲染</span>
        </div>

        <div class="input-group">
            <textarea id="prompt-input" placeholder="输入提示词... (例如: 一个在雨中撑伞的女孩)"></textarea>
        </div>

        <div class="ratio-selector">
            <div class="ratio-btn active" data-size="1024x1024">1:1</div>
            <div class="ratio-btn" data-size="1024x768">4:3</div>
            <div class="ratio-btn" data-size="1024x576">16:9</div>
            <div class="ratio-btn" data-size="768x1024">3:4</div>
            <div class="ratio-btn" data-size="576x1024">9:16</div>
        </div>

        <div class="controls">
            <button id="generate-btn">🎨 生成图片</button>
        </div>

        <div id="result-area">
            <div class="loading" id="loading">正在生成中，请稍候...</div>
            <img id="result-image" alt="Result">
            <p id="result-text" style="white-space: pre-wrap; margin-bottom: 10px;"></p>
            <a href="#" class="download-btn" id="download-link" download="generated-image.png">📥 下载图片</a>
        </div>
    </div>

    <script>
        // API Integration
        // Use relative path for API calls to support deployment
        const API_BASE = '/api';

        const imageUpload = document.getElementById('image-upload');
        const preview = document.getElementById('preview');
        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const loading = document.getElementById('loading');
        const resultImage = document.getElementById('result-image');
        const resultText = document.getElementById('result-text');
        const downloadLink = document.getElementById('download-link');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        
        let selectedSize = '1024x1024';

        // Ratio Selection
        ratioBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                ratioBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedSize = btn.dataset.size;
            });
        });

        // Handle Image Upload Preview
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Set Prompt from Template
        window.setPrompt = function(text) {
            promptInput.value = text;
        }

        // Generate Image
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value;
            const file = imageUpload.files[0];
            
            if (!prompt && !file) return alert('请上传图片或输入提示词');

            loading.style.display = 'block';
            resultImage.style.display = 'none';
            downloadLink.style.display = 'none';
            resultText.innerText = '任务提交中...';
            generateBtn.disabled = true;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('size', selectedSize);
            if (file) {
                formData.append('image', file);
            }

            try {
                const res = await fetch(`${API_BASE}/generate-image`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`Server Error (${res.status}): ${errorText.substring(0, 100)}...`);
                }

                const data = await res.json();
                
                // Handle Async Task Response
                if (data.taskId) {
                    const startTime = Date.now();
                    resultText.innerText = '正在生成中，请勿关闭页面... (0s)';
                    
                    const pollInterval = setInterval(async () => {
                        try {
                            const statusRes = await fetch(`${API_BASE}/task-status/${data.taskId}`);
                            if (!statusRes.ok) throw new Error('Status Check Failed');
                            
                            const statusData = await statusRes.json();
                            const elapsed = Math.floor((Date.now() - startTime) / 1000);
                            resultText.innerText = `正在生成中，请勿关闭页面... (${elapsed}s)`;

                            if (statusData.status === 'completed') {
                                clearInterval(pollInterval);
                                resultImage.src = statusData.imageUrl;
                                resultImage.style.display = 'block';
                                downloadLink.href = `/api/proxy-download?url=${encodeURIComponent(statusData.imageUrl)}`;
                                downloadLink.style.display = 'inline-block';
                                resultText.innerText = statusData.description || '生成成功！';
                                loading.style.display = 'none';
                                generateBtn.disabled = false;
                            } else if (statusData.status === 'failed') {
                                clearInterval(pollInterval);
                                throw new Error(statusData.error || '生成失败');
                            }
                            // Else: continue polling
                        } catch (pollErr) {
                            console.error(pollErr);
                            // Continue polling even if one request fails (network glitch)
                        }
                    }, 2000); // Poll every 2s

                } else if (data.imageUrl) {
                    // Fallback for direct response
                    resultImage.src = data.imageUrl;
                    resultImage.style.display = 'block';
                    downloadLink.href = `/api/proxy-download?url=${encodeURIComponent(data.imageUrl)}`;
                    downloadLink.style.display = 'inline-block';
                    if (data.description) resultText.innerText = data.description;
                    loading.style.display = 'none';
                    generateBtn.disabled = false;
                }

            } catch (err) {
                console.error(err);
                resultText.innerText = '生成出错: ' + err.message;
                loading.style.display = 'none';
                generateBtn.disabled = false;
            }
        });

        // Simple Particle Background
        (function() {
            const canvas = document.getElementById('particles-js');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2 + 0.5;
                    this.color = `rgba(0, 243, 255, ${Math.random() * 0.5})`;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for(let i=0; i<100; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
