<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油豆腐🐷 - AI 文字生成图片</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --secondary-color: #bc13fe;
            --accent-color: #ff0055;
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Canvas Background */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #11111e 0%, #000000 100%);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            width: 95%;
            margin: 40px auto;
            padding: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
            z-index: 10;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 10px var(--primary-color);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .ratio-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ratio-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
            min-width: 60px;
        }

        .ratio-btn:hover, .ratio-btn.active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.3);
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--primary-color);
            color: var(--text-color);
            padding: 15px;
            border-radius: 10px;
            resize: vertical;
            min-height: 150px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 15px var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
        }

        button:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
        }

        button.secondary {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        button.secondary:hover {
            background: var(--secondary-color);
            color: #fff;
            box-shadow: 0 0 20px var(--secondary-color);
        }

        .templates {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .tag:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        #result-area {
            margin-top: 30px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        #result-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            display: none;
        }

        .download-btn {
            display: none;
            text-decoration: none;
            background: var(--accent-color);
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 0 15px var(--accent-color);
        }
        
        .loading {
            display: none;
            color: var(--primary-color);
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <canvas id="particles-js"></canvas>

    <div class="container">
        <div class="nav-bar">
            <a href="../index.html" class="nav-btn">🏠 返回主页</a>
            <a href="ai.html" class="nav-btn">🖼️ 切换到图生图</a>
        </div>

        <h1>油豆腐🐷的文字生成图片</h1>

        <div class="templates">
            <span class="tag" onclick="setPrompt('一只赛博朋克风格的机械猫，霓虹灯背景')">机械猫</span>
            <span class="tag" onclick="setPrompt('未来城市的街道，飞行汽车，雨夜，高细节')">未来城市</span>
            <span class="tag" onclick="setPrompt('中国山水画风格，云雾缭绕，仙鹤飞舞')">水墨山水</span>
            <span class="tag" onclick="setPrompt('宇航员在火星上种土豆，写实风格，电影质感')">火星种田</span>
            <span class="tag" onclick="setPrompt('魔法森林，发光的蘑菇，精灵，梦幻氛围')">魔法森林</span>
        </div>

        <div class="input-group">
            <textarea id="prompt-input" placeholder="输入提示词... (例如: 一个在雨中撑伞的女孩)"></textarea>
        </div>

        <div class="ratio-selector">
            <div class="ratio-btn active" data-size="1024x1024">1:1</div>
            <div class="ratio-btn" data-size="1024x768">4:3</div>
            <div class="ratio-btn" data-size="1024x576">16:9</div>
            <div class="ratio-btn" data-size="768x1024">3:4</div>
            <div class="ratio-btn" data-size="576x1024">9:16</div>
        </div>

        <div class="controls">
            <button id="generate-btn">🎨 生成图片</button>
        </div>

        <div id="result-area">
            <div class="loading" id="loading">正在生成中，请稍候...</div>
            <img id="result-image" alt="Result">
            <p id="result-text" style="white-space: pre-wrap; margin-bottom: 10px;"></p>
            <a href="#" class="download-btn" id="download-link" download="generated-image.png">📥 下载图片</a>
        </div>
    </div>

    <script>
        // API Integration
        const API_BASE = '/api';

        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const loading = document.getElementById('loading');
        const resultImage = document.getElementById('result-image');
        const resultText = document.getElementById('result-text');
        const downloadLink = document.getElementById('download-link');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        
        let selectedSize = '1024x1024';

        // Ratio Selection
        ratioBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                ratioBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedSize = btn.dataset.size;
            });
        });

        // Set Prompt from Template
        window.setPrompt = function(text) {
            promptInput.value = text;
        }

        // Generate Image
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value;
            
            if (!prompt) return alert('请输入提示词');

            loading.style.display = 'block';
            resultImage.style.display = 'none';
            downloadLink.style.display = 'none';
            resultText.innerText = '';
            generateBtn.disabled = true;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('size', selectedSize);

            try {
                const res = await fetch(`${API_BASE}/generate-text`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`Server Error (${res.status}): ${errorText.substring(0, 100)}...`);
                }

                const data = await res.json();
                
                if (data.taskId) {
                    // Start polling
                    const startTime = Date.now();
                    const pollInterval = setInterval(async () => {
                        try {
                            // Timeout check (5 minutes)
                            if (Date.now() - startTime > 300000) {
                                clearInterval(pollInterval);
                                throw new Error('Task timed out');
                            }

                            const statusRes = await fetch(`${API_BASE}/task-status/${data.taskId}`);
                            if (!statusRes.ok) throw new Error('Failed to check status');
                            
                            const statusData = await statusRes.json();
                            
                            if (statusData.status === 'completed') {
                                clearInterval(pollInterval);
                                
                                if (statusData.imageUrl) {
                                    resultImage.src = statusData.imageUrl;
                                    resultImage.style.display = 'block';
                                    downloadLink.href = `/api/proxy-download?url=${encodeURIComponent(statusData.imageUrl)}`;
                                    downloadLink.style.display = 'inline-block';
                                }
                                if (statusData.description) {
                                    resultText.innerText = statusData.description;
                                }
                                
                                loading.style.display = 'none';
                                generateBtn.disabled = false;
                            } else if (statusData.status === 'failed') {
                                clearInterval(pollInterval);
                                throw new Error(statusData.error || 'Generation failed');
                            }
                            // If 'processing' or 'pending', continue polling
                        } catch (pollErr) {
                            clearInterval(pollInterval);
                            console.error(pollErr);
                            resultText.innerText = '生成出错: ' + pollErr.message;
                            loading.style.display = 'none';
                            generateBtn.disabled = false;
                        }
                    }, 2000);
                    
                    return;
                }

                // Fallback for immediate response (if any)
                if (data.imageUrl) {
                    resultImage.src = data.imageUrl;
                    resultImage.style.display = 'block';
                    // Use proxy download to avoid CORS issues and enable direct download
                    downloadLink.href = `/api/proxy-download?url=${encodeURIComponent(data.imageUrl)}`;
                    downloadLink.style.display = 'inline-block';
                }
                
                if (data.description) {
                    resultText.innerText = data.description;
                }

                if (!data.imageUrl && !data.description) {
                     resultText.innerText = "未收到结果，请重试。";
                }
                
                loading.style.display = 'none';
                generateBtn.disabled = false;

            } catch (err) {
                console.error(err);
                resultText.innerText = '生成出错: ' + err.message;
                loading.style.display = 'none';
                generateBtn.disabled = false;
            }
        });

        // Simple Particle Background
        (function() {
            const canvas = document.getElementById('particles-js');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2 + 0.5;
                    this.color = `rgba(0, 243, 255, ${Math.random() * 0.5})`;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for(let i=0; i<100; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
